app-id: tech.emendir.QR-ScanGen
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: "6.10"
command: qr-scangen
rename-icon: Icon
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=all # for camera via opencv
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
cleanup-commands:
  - /app/cleanup-BaseApp.sh
cleanup:
  - /lib/girepository-1.0
  - /share/doc
  - /share/gir-1.0
  - /share/man
  - '*.la'
  - '*.a'
modules:
  - name: ImageMagick
    buildsystem: autotools
    sources:
      - type: archive
        url: https://imagemagick.org/archive/releases/ImageMagick-7.1.2-25.tar.xz
        sha256: 2b2070802de374871737ff1a516b3d9d1e66643779b7ed9c52e2534db7772006

  - name: libzbar
    buildsystem: autotools
    sources:
      - type: archive
        url: https://linuxtv.org/downloads/zbar/zbar-0.23.93.tar.gz
        sha256: 78ae427a529f0399561bc198de5c2c7ca3f11d05fa9e903e65e501168433d218

  - python3-requirements.yaml

  - name: qr-scangen
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --prefix=/app --no-deps .
      - install -D packaging/share/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -D packaging/flatpak/manifest/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -D src/qr_scangen/Icon.svg -t /app/share/icons/hicolor/scalable/apps/
    sources:
      - type: git
        url: https://github.com/emendir/QR-ScanGen
        tag: v1.4.2
        commit: 56e4b62eb76721bfda0419bfdf5390c41a7b6384

